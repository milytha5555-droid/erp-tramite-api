<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#188a61">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ERP g&f">
    <title>Amazon Pedidos</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <section id="loginView" class="login-view" hidden>
      <form id="loginForm" class="login-panel">
        <div class="brand-mark">G&F</div>
        <p class="eyebrow">ERP g&f</p>
        <h1>Amazon Pedidos</h1>
        <label>
          Usuario
          <input id="username" autocomplete="username" value="admin" required>
        </label>
        <label>
          Clave
          <input id="password" type="password" autocomplete="current-password" value="admin123" required>
        </label>
        <button type="submit">Ingresar</button>
        <p id="loginStatus" class="login-status"></p>
      </form>
    </section>

    <main id="appView" class="app" hidden>
      <header class="topbar">
        <div class="title-group">
          <span class="brand-pill">ERP g&f</span>
          <div>
            <p class="eyebrow">Modulo</p>
            <h1>Amazon Pedidos</h1>
          </div>
        </div>
        <div class="actions">
          <span id="userLabel" class="user-label"></span>
          <span id="status" class="status">Conectando...</span>
          <button id="restoreBackup" class="secondary backup-action" type="button" hidden>Restaurar respaldo</button>
          <button id="editProducts" class="secondary" type="button">Editar productos</button>
          <button id="editStatuses" class="secondary" type="button">Editar estados</button>
          <button id="addRow" type="button">Agregar fila</button>
          <button id="deleteSelected" class="danger-action" type="button" disabled>Eliminar</button>
          <button id="logout" class="secondary" type="button">Salir</button>
        </div>
      </header>

      <section class="tabs" aria-label="Pestanas">
        <button class="tab active" type="button">Amazon Pedidos</button>
      </section>

      <section class="sheet" aria-label="Cuadro de pedidos">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="select-col"><input id="selectAll" type="checkbox" aria-label="Seleccionar todos"></th>
                <th>Cantidad</th>
                <th>Producto</th>
                <th># de pedido</th>
                <th># de rastreo</th>
                <th>F. de compra</th>
                <th>F. de llegada</th>
                <th>Envio</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <template id="rowTemplate">
      <tr>
        <td class="select-col"><input class="row-select" type="checkbox" aria-label="Seleccionar fila"></td>
        <td><input data-field="cantidad" inputmode="numeric" aria-label="Cantidad"></td>
        <td><input data-field="producto" aria-label="Producto" readonly></td>
        <td><input data-field="pedido" inputmode="text" autocomplete="off" aria-label="Numero de pedido"></td>
        <td><input data-field="rastreo" inputmode="text" autocomplete="off" aria-label="Numero de rastreo"></td>
        <td><input data-field="fechaCompra" type="date" aria-label="Fecha de compra"></td>
        <td>
          <div class="date-range" data-field="fechaLlegada">
            <input data-range="from" type="date" aria-label="Fecha de llegada desde">
            <span>a</span>
            <input data-range="to" type="date" aria-label="Fecha de llegada hasta">
          </div>
        </td>
        <td><input data-field="envio" aria-label="Envio"></td>
        <td>
          <select data-field="estado" aria-label="Estado" disabled>
            <option value=""></option>
            <option value="EN CAMINO">EN CAMINO</option>
            <option value="ENTREGADO">ENTREGADO</option>
            <option value="CANCELADO">CANCELADO</option>
            <option value="RECHAZADO">RECHAZADO</option>
          </select>
        </td>
      </tr>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
